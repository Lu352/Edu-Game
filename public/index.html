<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu-Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: "Segoe UI", "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: #2d1b4e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 20%, #fde68a 0%, transparent 35%),
        radial-gradient(circle at 85% 15%, #fda4af 0%, transparent 30%),
        radial-gradient(circle at 70% 80%, #86efac 0%, transparent 35%),
        linear-gradient(165deg, #7dd3fc, #a78bfa 45%, #f9a8d4);
    }
    main {
      max-width: 420px;
      width: 100%;
      background: #fffef8;
      border: 4px solid #fff;
      border-radius: 1.5rem;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 8px 0 rgba(45, 27, 78, 0.2);
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      margin-bottom: 0.35rem;
      text-shadow: 2px 2px 0 #fff;
    }
    p { margin-bottom: 1.25rem; line-height: 1.45; opacity: 0.9; }
    .links { display: flex; flex-direction: column; gap: 0.75rem; }
    a {
      display: block;
      text-decoration: none;
      font-weight: 800;
      color: #2d1b4e;
      padding: 0.85rem 1rem;
      border: 4px solid #fff;
      border-radius: 999px;
      box-shadow: 0 5px 0 rgba(45, 27, 78, 0.2);
      transition: transform 0.12s;
    }
    a:hover { transform: translateY(-2px); }
    a.quiz { background: #fef08a; }
    a.write { background: #bbf7d0; }
  </style>
</head>
<body>
  <main>
    <h1>Edu-Game</h1>
    <p>Debate practice — pick an activity:</p>
    <div class="links">
      <a class="quiz" href="quiz.html">Debate Quiz (floating answers)</a>
      <a class="write" href="writing-marking.html">Writing &amp; marking</a>
    </div>
  </main>
</body>
</html>
