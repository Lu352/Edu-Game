<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debate Quiz</title>
  <style>
    :root {
      --sky-top: #7dd3fc;
      --sky-mid: #a78bfa;
      --sky-bottom: #f9a8d4;
      --card: #fffef8;
      --ink: #2d1b4e;
      --accent: #ff6b9d;
      --correct: #22c55e;
      --wrong: #ef4444;
      --shadow: rgba(45, 27, 78, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "Segoe UI", "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, #fde68a 0%, transparent 35%),
        radial-gradient(circle at 85% 15%, #fda4af 0%, transparent 30%),
        radial-gradient(circle at 70% 80%, #86efac 0%, transparent 35%),
        linear-gradient(165deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
      overflow-x: hidden;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header { text-align: center; margin-bottom: 1rem; }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.4rem);
      letter-spacing: 0.02em;
      text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(255, 107, 157, 0.35);
      animation: bounce-title 2.4s ease-in-out infinite;
    }

    @keyframes bounce-title {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .progress {
      display: inline-flex;
      margin-top: 0.65rem;
      padding: 0.35rem 0.75rem;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      border: 3px solid #fff;
      box-shadow: 0 4px 0 var(--shadow);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .question-card {
      background: var(--card);
      border: 4px solid #fff;
      border-radius: 1.5rem;
      padding: 1.25rem 1.35rem;
      box-shadow: 0 8px 0 var(--shadow);
      position: relative;
      z-index: 2;
      animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .q-label {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.65rem;
      box-shadow: 0 3px 0 #c9184a;
    }

    .question-text {
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 800;
      line-height: 1.35;
    }

    .arena {
      position: relative;
      flex: 1;
      min-height: min(52vh, 420px);
      margin-top: 0.75rem;
      border-radius: 1.5rem;
      border: 4px dashed rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
      touch-action: manipulation;
    }

    .arena-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.35;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      padding: 1rem;
      z-index: 0;
    }

    .answer-btn {
      position: absolute;
      z-index: 1;
      max-width: min(78%, 280px);
      padding: 0.85rem 1.1rem;
      border: 4px solid #fff;
      border-radius: 1.25rem;
      font: inherit;
      font-weight: 800;
      font-size: clamp(0.9rem, 2.8vw, 1.05rem);
      line-height: 1.25;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 6px 0 var(--shadow);
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
    }

    .answer-btn:active:not(:disabled) {
      filter: brightness(0.95);
    }

    .answer-btn:disabled { cursor: default; }

    .answer-btn.palette-0 { background: #fef08a; }
    .answer-btn.palette-1 { background: #bbf7d0; }
    .answer-btn.palette-2 { background: #fda4af; }
    .answer-btn.palette-3 { background: #bfdbfe; }

    .answer-btn.correct {
      background: var(--correct) !important;
      color: white;
      border-color: #166534;
      box-shadow: 0 6px 0 #166534;
      z-index: 5;
    }

    .answer-btn.wrong {
      background: var(--wrong) !important;
      color: white;
      border-color: #991b1b;
      box-shadow: 0 6px 0 #991b1b;
      z-index: 5;
    }

    .answer-btn.dim {
      opacity: 0.55;
      filter: grayscale(0.3);
    }

    .feedback {
      text-align: center;
      margin-top: 0.85rem;
      min-height: 2.5rem;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .feedback.ok { color: #166534; }
    .feedback.bad { color: #991b1b; }

    .next-row {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
      min-height: 3rem;
    }

    .btn {
      appearance: none;
      border: 4px solid #fff;
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 5px 0 #c9184a;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c9184a;
    }

    .btn.hidden { display: none; }

    .btn.play-again {
      background: #8b5cf6;
      box-shadow: 0 5px 0 #5b21b6;
    }

    .btn.play-again:active { box-shadow: 0 2px 0 #5b21b6; }

    .results { display: none; animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .results.show { display: block; }

    .score-banner {
      text-align: center;
      background: var(--card);
      border: 4px solid #fff;
      border-radius: 1.5rem;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 8px 0 var(--shadow);
      margin-bottom: 1.25rem;
    }

    .score-banner h2 {
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      margin-bottom: 0.35rem;
    }

    .score-emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.35rem;
      animation: bounce-title 1.8s ease-in-out infinite;
    }

    .review {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .review-item {
      background: rgba(255, 255, 255, 0.88);
      border: 3px solid #fff;
      border-radius: 1.15rem;
      padding: 1rem 1.1rem;
      box-shadow: 0 4px 0 var(--shadow);
    }

    .review-item h3 {
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .review-meta {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
    }

    .review-meta .got-right { color: #166534; }
    .review-meta .got-wrong { color: #991b1b; }

    .explanation {
      font-size: 0.92rem;
      line-height: 1.45;
      opacity: 0.92;
    }

    .quiz-view.hidden,
    .results.hidden { display: none; }

    @media (max-width: 480px) {
      .arena { min-height: 48vh; }
      .answer-btn {
        max-width: 85%;
        padding: 0.75rem 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Debate Quiz!</h1>
      <div class="progress" id="progress" aria-live="polite">Question 1 of 3</div>
    </header>

    <div id="quiz-view" class="quiz-view">
      <div class="question-card">
        <span class="q-label" id="q-label">Question 1</span>
        <p class="question-text" id="question-text"></p>
      </div>

      <div class="arena" id="arena" aria-label="Floating answer choices">
        <div class="arena-hint">Tap a floating answer!</div>
      </div>

      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="next-row">
        <button type="button" class="btn hidden" id="next-btn">Next →</button>
      </div>
    </div>

    <div id="results" class="results hidden">
      <div class="score-banner">
        <span class="score-emoji" id="score-emoji">🎉</span>
        <h2 id="score-text"></h2>
        <p>Here’s why each correct answer is right:</p>
      </div>
      <div class="review" id="review"></div>
      <div class="next-row">
        <button type="button" class="btn play-again" id="play-again">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        question: 'What is a "rebuttal"?',
        options: [
          "Your opening greeting",
          "A response that argues against the other side's point",
          "The judge's final score",
          "A short break between speeches"
        ],
        correctIndex: 1,
        explanation:
          "In debate, a rebuttal is when you push back on the other team's argument—showing why their point is weak, wrong, or incomplete."
      },
      {
        question: "The team that agrees with the motion is called the...",
        options: [
          "Opposition",
          "Proposition",
          "Audience",
          "Timekeeper"
        ],
        correctIndex: 1,
        explanation:
          "The Proposition (sometimes called the Affirmative) supports the motion. The Opposition argues against it."
      },
      {
        question: 'What is a "motion" in a debate?',
        options: [
          "The topic or statement being debated",
          "A hand signal to the judge",
          "The winning team",
          "A type of microphone"
        ],
        correctIndex: 0,
        explanation:
          "A motion is the claim or topic the teams debate—for example, “This house believes homework should be banned.” The whole round centres on that statement."
      }
    ];

    const quizView = document.getElementById("quiz-view");
    const resultsView = document.getElementById("results");
    const progressEl = document.getElementById("progress");
    const qLabel = document.getElementById("q-label");
    const questionText = document.getElementById("question-text");
    const arena = document.getElementById("arena");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const scoreText = document.getElementById("score-text");
    const scoreEmoji = document.getElementById("score-emoji");
    const reviewEl = document.getElementById("review");
    const playAgainBtn = document.getElementById("play-again");

    let current = 0;
    let score = 0;
    let answers = [];
    let buttons = [];
    let floaters = [];
    let rafId = null;
    let answered = false;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function stopFloat() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      floaters = [];
    }

    function startFloat() {
      stopFloat();
      buttons.forEach((btn) => {
        const W = arena.clientWidth;
        const H = arena.clientHeight;
        const bw = btn.offsetWidth;
        const bh = btn.offsetHeight;
        const maxX = Math.max(8, W - bw - 8);
        const maxY = Math.max(8, H - bh - 8);
        floaters.push({
          el: btn,
          x: 8 + Math.random() * maxX,
          y: 8 + Math.random() * maxY,
          vx: (Math.random() * 0.55 + 0.25) * (Math.random() < 0.5 ? -1 : 1),
          vy: (Math.random() * 0.55 + 0.25) * (Math.random() < 0.5 ? -1 : 1),
          phase: Math.random() * Math.PI * 2,
          wobble: 0.35 + Math.random() * 0.35
        });
        btn.style.left = "0";
        btn.style.top = "0";
      });

      let last = performance.now();
      function tick(now) {
        const dt = Math.min(32, now - last) / 16.67;
        last = now;
        const W = arena.clientWidth;
        const H = arena.clientHeight;
        floaters.forEach((f) => {
          if (f.frozen) return;
          const bw = f.el.offsetWidth;
          const bh = f.el.offsetHeight;
          const maxX = Math.max(8, W - bw - 8);
          const maxY = Math.max(8, H - bh - 8);
          f.phase += 0.02 * dt;
          f.x += (f.vx + Math.sin(f.phase) * f.wobble * 0.3) * dt;
          f.y += (f.vy + Math.cos(f.phase * 0.9) * f.wobble * 0.3) * dt;
          if (f.x <= 8) { f.x = 8; f.vx = Math.abs(f.vx); }
          if (f.x >= maxX) { f.x = maxX; f.vx = -Math.abs(f.vx); }
          if (f.y <= 8) { f.y = 8; f.vy = Math.abs(f.vy); }
          if (f.y >= maxY) { f.y = maxY; f.vy = -Math.abs(f.vy); }
          f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
        });
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }

    function freezeFloaters() {
      floaters.forEach((f) => { f.frozen = true; });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showQuestion() {
      answered = false;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextBtn.classList.add("hidden");
      nextBtn.textContent = current === QUESTIONS.length - 1 ? "See Results →" : "Next →";

      const q = QUESTIONS[current];
      progressEl.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      qLabel.textContent = `Question ${current + 1}`;
      questionText.textContent = q.question;

      arena.querySelectorAll(".answer-btn").forEach((b) => b.remove());
      buttons = [];

      shuffle([0, 1, 2, 3]).forEach((optIndex, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `answer-btn palette-${i}`;
        btn.textContent = q.options[optIndex];
        btn.dataset.optIndex = String(optIndex);
        btn.addEventListener("click", () => onAnswer(btn, optIndex));
        arena.appendChild(btn);
        buttons.push(btn);
      });

      requestAnimationFrame(() => requestAnimationFrame(startFloat));
    }

    function onAnswer(clickedBtn, optIndex) {
      if (answered) return;
      answered = true;
      freezeFloaters();

      const q = QUESTIONS[current];
      const correct = optIndex === q.correctIndex;
      if (correct) score += 1;
      answers.push({ chosenIndex: optIndex, correct });

      buttons.forEach((btn) => {
        btn.disabled = true;
        const idx = Number(btn.dataset.optIndex);
        if (idx === q.correctIndex) btn.classList.add("correct");
        else if (btn === clickedBtn) btn.classList.add("wrong");
        else btn.classList.add("dim");
      });

      if (correct) {
        feedback.textContent = "Correct! ✓";
        feedback.className = "feedback ok";
      } else {
        feedback.textContent = "Not quite — the green one is right.";
        feedback.className = "feedback bad";
      }
      nextBtn.classList.remove("hidden");
    }

    function showResults() {
      stopFloat();
      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      resultsView.classList.add("show");

      scoreText.textContent = `You got ${score} out of ${QUESTIONS.length}`;
      scoreEmoji.textContent = score === QUESTIONS.length ? "🏆" : score >= 2 ? "🎉" : "💪";

      reviewEl.innerHTML = "";
      QUESTIONS.forEach((q, i) => {
        const a = answers[i];
        const item = document.createElement("div");
        item.className = "review-item";
        const correctText = q.options[q.correctIndex];
        const chosenText = q.options[a.chosenIndex];
        item.innerHTML = `
          <h3>${i + 1}. ${escapeHtml(q.question)}</h3>
          <p class="review-meta">
            ${a.correct
              ? `<span class="got-right">You chose: ${escapeHtml(chosenText)} ✓</span>`
              : `<span class="got-wrong">You chose: ${escapeHtml(chosenText)}</span><br>
                 <span class="got-right">Correct: ${escapeHtml(correctText)}</span>`}
          </p>
          <p class="explanation">${escapeHtml(q.explanation)}</p>
        `;
        reviewEl.appendChild(item);
      });
    }

    function resetGame() {
      current = 0;
      score = 0;
      answers = [];
      resultsView.classList.remove("show");
      resultsView.classList.add("hidden");
      quizView.classList.remove("hidden");
      showQuestion();
    }

    nextBtn.addEventListener("click", () => {
      if (current < QUESTIONS.length - 1) {
        current += 1;
        showQuestion();
      } else {
        showResults();
      }
    });

    playAgainBtn.addEventListener("click", resetGame);

    window.addEventListener("resize", () => {
      if (!answered && buttons.length) startFloat();
    });

    showQuestion();
  </script>
</body>
</html>
